name: Pulse across two Windows machines
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pair.yml
      - ci/pair-action/**
      - tests/exe-remote-pair*.mjs

permissions:
  contents: read
  actions: read

jobs:
  role:
    name: Pulse role ${{ matrix.role }} on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            image: windows-2022
          - role: B
            image: windows-2022
    runs-on: ${{ matrix.image }}
    timeout-minutes: 25
    env:
      PULSE_PAIR_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Extract and verify the exact release
        shell: pwsh
        run: |
          .\ci\unpack-inputs.ps1
          .\ci\prepare-windows.ps1
      - name: Install locked Actions artifact client
        shell: pwsh
        run: npm.cmd ci --prefix .\ci\pair-action --ignore-scripts --no-fund --no-audit
      - name: Connect the two running clients and record their room tests
        uses: ./ci/pair-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pulse-pair-result-${{ github.run_attempt }}-${{ matrix.role }}
          path: |
            test-runs/device.json
            test-runs/remote-${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 14

  correlate:
    name: Verify paired Windows evidence
    needs: role
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pulse-pair-result-${{ github.run_attempt }}-*
          path: pair-evidence
      - name: Correlate exact release, distinct machines and opposite verified identities
        shell: bash
        run: node ./ci/pair-action/verify-reports.mjs pair-evidence
